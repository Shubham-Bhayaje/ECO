version: '3.8'

services:
  # 1. PostgreSQL 15 with PostGIS Spatial Extension
  postgres-db:
    image: postgis/postgis:15-3.3
    container_name: ecoride-postgres
    restart: always
    environment:
      POSTGRES_DB: ecoride_db
      POSTGRES_USER: ecoride_admin
      POSTGRES_PASSWORD: ecoride_local_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoride_admin -d ecoride_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis for Distributed Rate Limiting & WebSockets
  redis:
    image: redis:7-alpine
    container_name: ecoride-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. HashiCorp Vault for Key & Secret Management
  vault:
    image: hashicorp/vault:latest
    container_name: ecoride-vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ecoride_dev_root_token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

volumes:
  postgres_data:
  redis_data:
