name: ride_sharing_project
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Firebase (Auth only)
  firebase_core: ^3.13.0
  firebase_auth: ^5.6.0
  google_sign_in: ^6.2.2

  # HTTP & Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # Open-Source Maps (OpenStreetMap / Carto)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Maps
  google_maps_flutter: ^2.10.0

  # Location & Permissions
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI Utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Push Notifications
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/eco_ride_illustration.png
    - assets/google_logo.png
    - assets/permission_illustration.png
